name: "Build"

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      EXPAT_VERSION: 2.4.4

    strategy:
      fail-fast: false
      matrix:
        luaVersion: ["5.1", "5.2", "5.3", "5.4", "luajit-2.1.0-beta3", "luajit-openresty"]

    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

    - uses: leafo/gh-actions-lua@ea0ae38722c0b45aa4e770f7c4a650c6b26800d0 # v8
      with:
        luaVersion: ${{ matrix.luaVersion }}

    - uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4

    - name: build expat
      run: |
        git clone -b R_$(echo $EXPAT_VERSION | sed "s/\./_/g") --single-branch https://github.com/libexpat/libexpat.git
        cd libexpat/expat
        ./buildconf.sh
        ./configure
        sudo make install

    - name: Lua dependencies
      run: |
        git config --global url.https://github.com/.insteadOf git://github.com/
        luarocks install busted
        luarocks install luacov-coveralls

    - name: build
      run: |
        luarocks make

    - name: Busted tests
      run: |
        busted --coverage --Xoutput "--color"

    - name: Report test coverage
      if: success()
      continue-on-error: true
      run: luacov-coveralls
      env:
        COVERALLS_REPO_TOKEN: ${{ github.token }}
