name: "Build"

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    env:
      EXPAT_VERSION: 2.4.4

    strategy:
      fail-fast: false
      matrix:
        luaVersion: ["5.1", "5.2", "5.3", "5.4", "luajit-2.1.0-beta3", "luajit-openresty"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: luarocks/gh-actions-lua@85e2287697275df96334743ac654241a8fd34ab3 # v13
      with:
        luaVersion: ${{ matrix.luaVersion }}

    - uses: luarocks/gh-actions-luarocks@95d2308a0aff36ad31ebadca493ed14853399842 # v7

    - name: build expat
      run: |
        git clone -b R_$(echo $EXPAT_VERSION | sed "s/\./_/g") --single-branch https://github.com/libexpat/libexpat.git
        cd libexpat/expat
        ./buildconf.sh
        ./configure
        sudo make install

    - name: Lua dependencies
      run: |
        git config --global url.https://github.com/.insteadOf git://github.com/
        luarocks install busted
        luarocks install luacov-coveralls

    - name: build
      run: |
        luarocks make

    - name: Busted tests
      run: |
        busted --coverage --Xoutput "--color"

    - name: Report test coverage
      if: success()
      continue-on-error: true
      run: luacov-coveralls
      env:
        COVERALLS_REPO_TOKEN: ${{ github.token }}
